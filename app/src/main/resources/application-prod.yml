spring:
  # SpringDoc OpenAPI 설정
  doc:
    api-docs:
      path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  
  # Mail 설정 (연결 실패해도 앱 시작되도록)
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 운영 환경 로깅 설정
logging:
  level:
    root: INFO
    party.manitto: INFO
    org.springframework.mail: WARN  # Mail 로그 최소화
    org.springframework.boot: INFO
    org.flywaydb: INFO  # Flyway 로그 확인
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 운영 환경 CORS 설정 (필요시 조정)
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

