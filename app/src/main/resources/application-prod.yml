spring:
  # 운영 환경에서는 Swagger 활성화 (필요시 비활성화 가능)
  doc:
    api-docs:
      path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 운영 환경 로깅 설정
logging:
  level:
    root: INFO
    party.manitto: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# 운영 환경 CORS 설정 (필요시 조정)
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

