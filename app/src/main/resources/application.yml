jwt:
  secret: ${JWT_SECRET}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}

spring:
  doc:
    api-docs:
      path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/manitto}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:${DDL_AUTO:validate}}
    show-sql: ${SPRING_JPA_SHOW_SQL:${SHOW_SQL:false}}
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:root}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
    locations: classpath:db/migration
    check-location: true
    validate-on-migrate: true
    schemas: ${DB_SCHEMA:root}
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  base-url: ${APP_BASE_URL:}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  domain: ${APP_DOMAIN:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  email-worker:
    enabled: ${APP_EMAIL_WORKER_ENABLED:false}
    poll-interval-ms: ${APP_EMAIL_WORKER_POLL_INTERVAL_MS:1000}
    batch-size: ${APP_EMAIL_WORKER_BATCH_SIZE:20}
    max-attempts: ${APP_EMAIL_WORKER_MAX_ATTEMPTS:5}
    lock-timeout-minutes: ${APP_EMAIL_WORKER_LOCK_TIMEOUT_MINUTES:10}
