name: Deploy to NCP

on:
  push:
    branches: [master]
  workflow_dispatch:  # 수동 실행 가능

env:
  DOCKER_IMAGE: manitto-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew :app:bootJar --parallel --build-cache --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Save Docker Image (compressed)
        run: docker save ${{ env.DOCKER_IMAGE }}:${{ github.sha }} | gzip -1 > image.tar.gz

      - name: Copy files to NCP Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          password: ${{ secrets.NCP_PASSWORD }}
          port: ${{ secrets.NCP_PORT }}
          source: "image.tar.gz,docker-compose.yml"
          target: "/opt/manitto-backend"
          strip_components: 0

      - name: Deploy to NCP Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          password: ${{ secrets.NCP_PASSWORD }}
          port: ${{ secrets.NCP_PORT }}
          script: |
            cd /opt/manitto-backend
            
            # 환경변수 파일 생성
            cat > .env << 'EOF'
            DB_URL=${{ secrets.DB_URL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            DDL_AUTO=validate
            SHOW_SQL=false
            SPRING_PROFILES_ACTIVE=prod
            EOF
            
            # Docker 이미지 로드
            gunzip -c image.tar.gz | docker load
            
            # docker-compose.yml에서 빌드 설정을 이미지로 변경
            sed -i 's|build:|image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}|g' docker-compose.yml
            sed -i '/context:/d' docker-compose.yml
            sed -i '/dockerfile:/d' docker-compose.yml
            sed -i '/Dockerfile/d' docker-compose.yml
            
            # 기존 컨테이너 정지 및 새 컨테이너 실행
            docker-compose down || true
            docker-compose up -d
            
            # 정리
            rm -f image.tar.gz
            docker image prune -f
