name: Deploy to NCP

on:
  push:
    branches: [master]
  workflow_dispatch:  # 수동 실행 가능

env:
  DOCKER_IMAGE: manitto-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :app:bootJar --no-daemon

      - name: Build Docker Image
        run: docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .

      - name: Save Docker Image
        run: docker save ${{ env.DOCKER_IMAGE }}:${{ github.sha }} | gzip > image.tar.gz

      - name: Copy to NCP Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_SSH_KEY }}
          port: ${{ secrets.NCP_PORT }}
          source: "image.tar.gz,docker-compose.yml"
          target: "/opt/manitto-backend"

      - name: Deploy to NCP Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_SSH_KEY }}
          port: ${{ secrets.NCP_PORT }}
          script: |
            cd /opt/manitto-backend
            
            # 환경변수 파일 생성 (NCP RDS 사용)
            cat > .env << 'EOF'
            DB_URL=${{ secrets.DB_URL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            DDL_AUTO=update
            SHOW_SQL=false
            EOF
            
            # Docker 이미지 로드
            gunzip -c image.tar.gz | docker load
            
            # 기존 컨테이너 정지 및 제거
            docker-compose down || true
            
            # docker-compose.yml에서 이미지 태그 업데이트
            sed -i 's|build:.*|image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}|g' docker-compose.yml
            sed -i '/context:/d' docker-compose.yml
            sed -i '/dockerfile:/d' docker-compose.yml
            
            # 새 컨테이너 실행
            docker-compose up -d
            
            # 정리
            rm -f image.tar.gz
            docker image prune -f

