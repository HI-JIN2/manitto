name: Deploy to NCP

on:
  push:
    branches: [master]
  workflow_dispatch:  # 수동 실행 가능

env:
  DOCKER_IMAGE: manitto-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 모든 히스토리 가져오기 (태그 생성을 위해)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew :app:bootJar --parallel --build-cache --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Save Docker Image (compressed)
        run: docker save ${{ env.DOCKER_IMAGE }}:prod | gzip -1 > image.tar.gz

      - name: Copy files to NCP Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          password: ${{ secrets.NCP_PASSWORD }}
          port: ${{ secrets.NCP_PORT }}
          source: "image.tar.gz,docker-compose.yml"
          target: "/opt/manitto-backend"
          strip_components: 0

      - name: Deploy to NCP Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          password: ${{ secrets.NCP_PASSWORD }}
          port: ${{ secrets.NCP_PORT }}
          script: |
            cd /opt/manitto-backend
            
            # 환경변수 파일 생성 (기존 파일이 있으면 DDL_AUTO 유지)
            if [ -f .env ]; then
              # 기존 .env에서 DDL_AUTO 값 가져오기
              EXISTING_DDL_AUTO=$(grep "^DDL_AUTO=" .env | cut -d'=' -f2 || echo "update")
            else
              EXISTING_DDL_AUTO="update"
            fi
            
            cat > .env << EOF
            DB_URL=${{ secrets.DB_URL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            DDL_AUTO=${EXISTING_DDL_AUTO}
            SHOW_SQL=false
            SPRING_PROFILES_ACTIVE=prod
            EOF
            
            # Docker 이미지 로드 (기존 prod 이미지를 새 이미지로 덮어씀)
            gunzip -c image.tar.gz | docker load
            
            # 기존 컨테이너 정지 및 새 컨테이너 실행
            docker-compose down || true
            docker-compose up -d
            
            # 정리
            rm -f image.tar.gz
            docker image prune -f

      - name: Generate Release Notes
        id: release_notes
        run: |
          # 마지막 태그 이후의 커밋 메시지 수집
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            # 태그가 없으면 최근 20개 커밋만
            COMMITS=$(git log -20 --pretty=format:"- %s (%h)" --no-merges)
          else
            # 마지막 태그 이후의 커밋
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # 버전 계산 (날짜 기반 + 빌드 번호)
          VERSION=$(date +"%Y.%m.%d")
          BUILD_NUMBER=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          FULL_VERSION="${VERSION}.${BUILD_NUMBER}"
          
          # CHANGELOG.md에서 Unreleased 섹션 추출 (있는 경우)
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_CONTENT=$(sed -n '/## \[Unreleased\]/,/## \[/p' CHANGELOG.md | sed '/## \[/d' || echo "")
          else
            CHANGELOG_CONTENT=""
          fi
          
          # 릴리즈 노트 생성
          if [ -n "$CHANGELOG_CONTENT" ]; then
            RELEASE_NOTES=$(cat <<EOF
          ## Release ${FULL_VERSION}
          
          ${CHANGELOG_CONTENT}
          
          ### Commits
          ${COMMITS}
          
          ### Deployment Info
          - **Deployed at**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Commit**: ${GITHUB_SHA:0:7}
          - **Branch**: ${GITHUB_REF#refs/heads/}
          EOF
            )
          else
            RELEASE_NOTES=$(cat <<EOF
          ## Release ${FULL_VERSION}
          
          ### Changes
          ${COMMITS}
          
          ### Deployment Info
          - **Deployed at**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Commit**: ${GITHUB_SHA:0:7}
          - **Branch**: ${GITHUB_REF#refs/heads/}
          EOF
            )
          fi
          
          echo "version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.release_notes.outputs.version }}" -m "Release v${{ steps.release_notes.outputs.version }}"
          git push origin "v${{ steps.release_notes.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.release_notes.outputs.version }}
          name: Release v${{ steps.release_notes.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
